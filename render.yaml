databases:
  - name: booking-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: booking_db
    user: booking

services:
  - type: web
    name: booking-api-rohankapadiya
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: booking-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: booking-web-rohankapadiya
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /login
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://booking-api-rohankapadiya.onrender.com